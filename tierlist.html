<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dungeon LootR — Class Tier List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css?v=87" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="frame">
      <header class="masthead">
        <div class="brand">
          <span>Dungeon LootR</span>
          <strong>Competitive roster</strong>
        </div>
        <div class="title-block">
          <div class="ornament"><i></i><span></span><i></i></div>
          <h1 id="title">Class Tier List</h1>
          <div class="ornament invert"><i></i><span></span><i></i></div>
        </div>
        <a class="game-mark" href="index.html">
          <img src="assets/img/logo.png?v=8" alt="Dungeon LootR" />
        </a>
      </header>

      <nav id="site-nav" class="site-nav" aria-label="Primary"></nav>

      <div class="console">
        <div class="toolbar">
          <label class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
            <input id="search" class="search" type="search" placeholder="Search class, archetype, rarity" />
          </label>
          <div id="filters" class="filters"></div>
        </div>
        <div id="legend" class="legend"></div>
      </div>

      <div id="board" class="board"></div>

      <section class="podium-wrap">
        <div id="podiums" class="podiums"></div>
      </section>
      <p class="foot" id="source"></p>
    </main>

    <script src="data/site.js?v=31"></script>
    <script src="data/tierlist.js?v=25"></script>
    <script src="js/site.js?v=30"></script>
    <script src="data/search-index.js?v=1"></script>
    <script src="js/search.js?v=1"></script>
    <script src="js/app.js?v=25"></script>
  </body>
</html>
